<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinora - adicionar addon</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0a0a0d; color: #f2f2f5; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  input, button { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin: 6px 0 14px; border-radius: 10px; border: 1px solid #333; background: #1c1c22; color: #f2f2f5; }
  button { background: #fff; color: #0a0a0d; font-weight: 700; cursor: pointer; }
  small { color: #9a9aa6; }
</style>
</head>
<body>
<h2>Kinora - adicionar addon</h2>
<label>IP do Roku</label>
<input id="ip" placeholder="192.168.0.50" inputmode="decimal">
<label>URL do addon (manifest)</label>
<input id="url" placeholder="https://.../manifest.json">
<button onclick="send()">Enviar para a TV</button>
<p id="msg"></p>
<small>
  Abra este arquivo direto no navegador (arquivo local) ou por um endereco http://. Paginas em https:// nao conseguem
  falar com o Roku (conteudo misto). A TV vai pedir confirmacao antes de adicionar.
  Este projeto nao recomenda nem fornece addons.
</small>
<script>
function send() {
  var ip = document.getElementById('ip').value.trim();
  var url = document.getElementById('url').value.trim();
  var msg = document.getElementById('msg');
  if (!ip || !url) { msg.textContent = 'Preencha o IP e a URL.'; return; }
  fetch('http://' + ip + ':8060/launch/dev?addon=' + encodeURIComponent(url), { method: 'POST', mode: 'no-cors' })
    .then(function () { msg.textContent = 'Enviado. Confirme na TV.'; })
    .catch(function () { msg.textContent = 'Nao consegui falar com o Roku. Confira o IP e a rede.'; });
}
</script>
</body>
</html>
