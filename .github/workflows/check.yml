name: check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checagem estatica do projeto
        run: python3 tools/lint.py
      - name: Empacotar (teste)
        run: sh tools/package.sh kinora-test.zip
