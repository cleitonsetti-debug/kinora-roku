name: release

# Ao enviar uma tag (ex.: git tag v1.4.0 && git push origin v1.4.0) o zip do Roku
# e gerado e anexado a uma release (criada como pre-lancamento, se ainda nao existir).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checagem estatica
        run: python3 tools/lint.py
      - name: Empacotar
        run: sh tools/package.sh "kinora-${GITHUB_REF_NAME}-roku.zip"
      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="kinora-${GITHUB_REF_NAME}-roku.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" --title "Kinora $GITHUB_REF_NAME" --generate-notes --prerelease
          fi
